name: Build MapNavigator2D

on:
  push:
    branches:
      - main
      - dev
      - feat/*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: "latest"

      - name: Restore NuGet packages
        run: nuget restore MapNavigator2D.sln

      - name: Build solution
        run: msbuild MapNavigator2D.sln /p:Configuration=Release /p:Platform=x64
